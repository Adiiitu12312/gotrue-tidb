name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
    tags: ["*"]

permissions:
  contents: read

jobs:
  compile_check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check compilation
        run: |
          go build -v -o auth .

  test_tidb:
    name: Test / TiDB
    runs-on: ubuntu-latest
    services:
      tidb:
        image: pingcap/tidb:v8.1.0
        ports:
          - 4000:4000
          - 10080:10080
        options: >-
          --health-cmd "curl -s http://localhost:10080/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Init Database
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -P 4000 -u root < hack/init_mysql.sql
          mysql -h 127.0.0.1 -P 4000 -u root -e "SET GLOBAL tidb_txn_mode = 'pessimistic'; SET GLOBAL transaction_isolation = 'READ-COMMITTED';"
      - name: Run migrations
        run: |
          make migrate_tidb
      - name: Run tests
        env:
          GOTRUE_DB_DRIVER: tidb
          DATABASE_URL: "mysql://root:@127.0.0.1:4000/auth?parseTime=true&multiStatements=true"
        run: |
          go test ./internal/conf/... ./internal/crypto/... ./internal/utilities/... ./internal/tokens/... ./internal/security/... ./internal/ratelimit/... ./internal/storage ./internal/models ./internal/api/oauthserver/... -v -p 1 -count=1

  test_mysql:
    name: Test / MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth
          MYSQL_USER: supabase_auth_admin
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Init Database
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root -proot < hack/init_mysql.sql
      - name: Run migrations
        run: |
          make migrate_mysql
      - name: Run tests
        env:
          GOTRUE_DB_DRIVER: mysql
          DATABASE_URL: "mysql://supabase_auth_admin:root@127.0.0.1:3306/auth?parseTime=true&multiStatements=true"
        run: |
          go test ./internal/conf/... ./internal/crypto/... ./internal/utilities/... ./internal/tokens/... ./internal/security/... ./internal/ratelimit/... ./internal/storage ./internal/models ./internal/api/oauthserver/... -v -p 1 -count=1

  test_postgres:
    name: Test / Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Init Database
        run: psql -f hack/init_postgres.sql postgresql://postgres:root@localhost:5432/postgres
      - name: Run migrations
        run: make migrate_dev
      - name: Run tests
        run: |
          go test ./internal/conf/... ./internal/crypto/... ./internal/utilities/... ./internal/tokens/... ./internal/security/... ./internal/ratelimit/... ./internal/storage ./internal/models ./internal/api/oauthserver/... -v -p 1 -count=1
